name: Build Serial Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtserialport qtserialbus qtwebsockets qtgraphs qtquick3d qtcharts qtpositioning qtconnectivity qt5compat qtshadertools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and Package
        shell: cmd
        run: |
          cmake -B build -G "Ninja" -DPRODUCTION_OPTIMIZATION=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          mkdir release_pkg
          copy build\*.exe release_pkg\
          windeployqt --qmldir app/qml release_pkg\*.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Serial-Studio-Win64
          path: release_pkg/

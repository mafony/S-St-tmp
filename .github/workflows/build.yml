name: Build Serial Studio Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtserialport qtgraphs qtcharts qtpositioning qtconnectivity qt5compat qtshadertools'

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DPRODUCTION_OPTIMIZATION=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release --parallel

      - name: Package binaries
        run: |
          mkdir release_pkg
          copy build\Release\*.exe release_pkg\
          windeployqt --qmldir app/qml release_pkg\*.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Serial-Studio-Win64
          path: release_pkg/
